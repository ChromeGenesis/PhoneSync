name: phonesync
description: "PhoneSync — wireless phone <-> PC file sync over ADB, reimagined."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^8.2.1
  shared_preferences: ^2.3.2
  window_manager: ^0.4.3
  file_selector: ^1.0.3
  desktop_drop: ^0.8.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/google_fonts/
    - assets/app_icon.png
